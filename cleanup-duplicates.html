<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>จัดการข้อมูลซ้ำ → Firebase</title>
<style>body{font-family:system-ui;max-width:920px;margin:30px auto;padding:20px;background:#1a1a1a;color:#eee;}
button{background:#C9A84C;color:#000;border:none;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin:4px;}
button.scan{background:#4a9eff;color:#fff;}
button.hide{background:#e08e0b;color:#fff;}
button.del{background:#d9534f;color:#fff;}
button:disabled{opacity:.4;cursor:not-allowed;}
#log{margin-top:20px;font-size:13px;line-height:1.7;max-height:450px;overflow-y:auto;background:#000;padding:16px;border-radius:10px;}
.ok{color:#6cd86c;} .err{color:#ff6b6b;} .info{color:#888;} .warn-txt{color:#ffc107;}
h1{font-size:20px;}
.warn{background:#1e3a1e;border:1px solid #6cd86c;padding:14px;border-radius:10px;margin:16px 0;font-size:13px;}
.box{background:#222;border-radius:10px;padding:14px;margin:10px 0;}</style>
</head><body>
<h1>🧹 จัดการข้อมูลซ้ำ (ปลอดภัย — ไม่ลบจริง)</h1>
<div class="warn">✅ <b>วิธีนี้ปลอดภัย</b> — บริการซ้ำจะถูก <b>ซ่อน</b> (mark hidden) ไม่ได้ลบจริง ประวัติการขายเก่าไม่หาย และย้อนกลับได้<br>
ลูกค้าซ้ำจะเก็บอันที่ <b>points มากสุด</b> แล้วซ่อนอันที่เหลือ</div>

<button class="scan" id="scanBtn" onclick="scan()">🔍 สแกนหาข้อมูลซ้ำ</button>
<button class="hide" id="hideBtn" onclick="doHide()" disabled>👁️ ซ่อนข้อมูลซ้ำ (แนะนำ)</button>
<button id="unhideBtn" onclick="unhideAll()">↩️ ยกเลิกการซ่อนทั้งหมด</button>

<div id="log"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import{getFirestore,collection,getDocs,updateDoc,doc}from'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
const FB={apiKey:'AIzaSyDSuBAXVbzaMwNJEVQYxYDF8Q0zPWYxUhQ',authDomain:'carcare-pos-559ef.firebaseapp.com',projectId:'carcare-pos-559ef',storageBucket:'carcare-pos-559ef.appspot.com',appId:'1:562909364593:web:549e45b521adb45247f6d0'};
const app=initializeApp(FB);const db=getFirestore(app);
const L=(m,c='info')=>{const d=document.getElementById('log');d.innerHTML+=`<div class="${c}">${m}</div>`;d.scrollTop=d.scrollHeight;};
function num(v){return parseInt(v)||0;}
let toHide={customers:[],services:[]};

window.scan=async function(){
  document.getElementById('log').innerHTML='';
  toHide={customers:[],services:[]};
  L('🔍 กำลังสแกน...');

  // CUSTOMERS — group by plate+name
  const custSnap=await getDocs(collection(db,'customers'));
  const custs=custSnap.docs.map(d=>({_id:d.id,...d.data()}));
  L(`<br><b>ลูกค้าทั้งหมด: ${custs.length} รายการ</b>`);
  const cg={};
  custs.forEach(c=>{const k=((c.plate||'').replace(/\s+/g,'').toUpperCase())+'|'+((c.name||'').trim());(cg[k]=cg[k]||[]).push(c);});
  let cdup=0;
  Object.values(cg).forEach(group=>{
    if(group.length<2)return;
    group.sort((a,b)=>num(b.points)-num(a.points)||num(b.visits)-num(a.visits));
    const keep=group[0];const rest=group.slice(1);cdup+=rest.length;
    L(`<div class="box">🔁 <b>${keep.name||'(ไม่มีชื่อ)'}</b> (${keep.plate||'-'}) ซ้ำ ${group.length}<br>
      <span class="ok">✓ เก็บ: ${keep.points||0} pts</span> · <span class="warn-txt">ซ่อน ${rest.length} อัน</span></div>`);
    rest.forEach(r=>toHide.customers.push(r._id));
  });
  L(cdup===0?'✅ ไม่พบลูกค้าซ้ำ':'⚠️ ลูกค้าซ้ำที่จะซ่อน: '+cdup,cdup===0?'ok':'warn-txt');

  // SERVICES — group by code+name
  const svcSnap=await getDocs(collection(db,'services'));
  const svcs=svcSnap.docs.map(d=>({_id:d.id,...d.data()}));
  L(`<br><b>บริการทั้งหมด: ${svcs.length} รายการ</b>`);
  const sg={};
  svcs.forEach(s=>{const k=((s.code||'').trim())+'|'+((s.name||'').trim());(sg[k]=sg[k]||[]).push(s);});
  let sdup=0;
  Object.values(sg).forEach(group=>{
    if(group.length<2)return;
    // keep the one that is NOT hidden and has most price data, else first
    group.sort((a,b)=>(a.hidden?1:0)-(b.hidden?1:0));
    const keep=group[0];const rest=group.slice(1);sdup+=rest.length;
    L(`🔁 ${keep.code||'-'} ${keep.name} ซ้ำ ${group.length} → ซ่อน ${rest.length}`,'warn-txt');
    rest.forEach(r=>toHide.services.push(r._id));
  });
  L(sdup===0?'✅ ไม่พบบริการซ้ำ':'⚠️ บริการซ้ำที่จะซ่อน: '+sdup,sdup===0?'ok':'warn-txt');

  const total=toHide.customers.length+toHide.services.length;
  L(`<br><b>📊 รวมที่จะซ่อน: ${total} รายการ</b>`,total>0?'warn-txt':'ok');
  if(total>0)document.getElementById('hideBtn').disabled=false;
};

window.doHide=async function(){
  const total=toHide.customers.length+toHide.services.length;
  if(total===0)return;
  if(!confirm(`ซ่อน ${total} รายการ?\n(ไม่ลบจริง ย้อนกลับได้)`))return;
  const btn=document.getElementById('hideBtn');btn.disabled=true;btn.textContent='กำลังซ่อน...';
  L('<br>👁️ เริ่มซ่อน...','warn-txt');
  let n=0;
  for(const id of toHide.customers){try{await updateDoc(doc(db,'customers',id),{hidden:true});n++;}catch(e){L('❌ '+e.message,'err');}}
  for(const id of toHide.services){try{await updateDoc(doc(db,'services',id),{hidden:true});n++;}catch(e){L('❌ '+e.message,'err');}}
  L(`🎉 ซ่อนเรียบร้อย ${n} รายการ — รีเฟรชหน้า POS/Dashboard เพื่อดูผล`,'ok');
  btn.textContent='✅ ซ่อนเสร็จแล้ว';
};

window.unhideAll=async function(){
  if(!confirm('ยกเลิกการซ่อนทั้งหมด? (ข้อมูลที่ซ่อนจะกลับมาแสดง)'))return;
  document.getElementById('log').innerHTML='';
  L('↩️ กำลังยกเลิกการซ่อน...');
  let n=0;
  for(const col of ['customers','services']){
    const snap=await getDocs(collection(db,col));
    for(const d of snap.docs){
      if(d.data().hidden){try{await updateDoc(doc(db,col,d.id),{hidden:false});n++;}catch(e){}}
    }
  }
  L(`✅ ยกเลิกการซ่อน ${n} รายการแล้ว`,'ok');
};
</script></body></html>
