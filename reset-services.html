let oldIds=[];

window.scan=async function(){
  document.getElementById('log').innerHTML='';
  const snap=await getDocs(collection(db,'services'));
  oldIds=snap.docs.map(d=>d.id);
  L(`<b>Services เก่าในระบบ: ${oldIds.length} รายการ</b> → จะลบทั้งหมด`,'warn-txt');
  L(`<b>จะใส่ใหม่ตาม Excel: ${EXCEL.length} รายการ</b>`,'ok');
  L('<br>รายการใหม่ที่จะใส่:');
  EXCEL.forEach(s=>L(`  ${s.code} — ${s.name} (M: ฿${s.M}, C-S ${s.CS_M}, C-O ${s.CO_M})`,'info'));
  document.getElementById('goBtn').disabled=false;
};

window.doReset=async function(){
  if(!confirm(`ลบ ${oldIds.length} services เก่า แล้วใส่ ${EXCEL.length} ใหม่?\n(transactions ไม่กระทบ)`))return;
  const btn=document.getElementById('goBtn');btn.disabled=true;btn.textContent='กำลังทำงาน...';
  document.getElementById('scanBtn').disabled=true;

  L('<br>🗑 ลบ services เก่า...','warn-txt');
  let d=0;
  for(const id of oldIds){try{await deleteDoc(doc(db,'services',id));d++;if(d%10===0)L('  ลบ '+d+'...');}catch(e){L('❌ '+e.message,'err');}}
  L(`✅ ลบเก่า ${d} รายการ`,'ok');

  L('📥 ใส่ใหม่ 42 รายการ...','warn-txt');
  let a=0;
  for(const s of EXCEL){
    const data={...s,SC:s.CS_M||0,SCo:s.CO_M||0,cpnWash:0,cpnMonth:0,hidden:false};
    try{await addDoc(collection(db,'services'),data);a++;L(`  ✅ ${s.code} ${s.name}`,'ok');}catch(e){L('❌ '+e.message,'err');}
  }
  L(`<br>🎉 เสร็จ! Services = ${a} รายการ สะอาดตาม Excel · รีเฟรช Dashboard`,'ok');
  btn.textContent='✅ เสร็จแล้ว';
};
