<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E8B400">
<title>Bike Services POS</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --yellow:#E8B400;--yellow-dark:#C8960A;--yellow-light:#FFF8E1;
    --navy:#1C2B4A;--navy-light:#2A3F6A;
    --red:#C8261E;--green:#1D9E75;--green-light:#E1F5EE;
    --orange:#F57C00;--orange-light:#FFF3E0;
    --gray-100:#F5F5F5;--gray-200:#EEEEEE;--gray-400:#BDBDBD;
    --gray-600:#757575;--gray-800:#424242;--gray-900:#212121;
    --white:#FFFFFF;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  body{font-family:'Sarabun',sans-serif;background:#F0F2F5;color:var(--gray-900);min-height:100vh}
  .hidden{display:none!important}

  /* ── SCREEN MANAGER ── */
  .screen{display:none;min-height:100vh}
  .screen.active{display:block}

  /* ── LOGIN ── */
  #screen-login{background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
  .login-logo{width:72px;height:72px;background:var(--yellow);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:var(--navy);margin-bottom:1rem}
  .login-title{color:var(--white);font-size:22px;font-weight:700;margin-bottom:.25rem}
  .login-sub{color:rgba(255,255,255,.55);font-size:13px;margin-bottom:2rem}
  .branch-select{width:100%;max-width:320px;padding:12px 14px;border-radius:var(--radius);border:none;font-family:'Sarabun',sans-serif;font-size:15px;background:rgba(255,255,255,.12);color:var(--white);margin-bottom:1rem;outline:none}
  .branch-select option{color:var(--gray-900);background:white}
  .pin-label{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:.75rem;align-self:flex-start;max-width:320px;width:100%}
  .pin-dots{display:flex;gap:12px;margin-bottom:1.5rem}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);transition:.2s}
  .pin-dot.filled{background:var(--yellow);border-color:var(--yellow)}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
  .pin-btn{background:rgba(255,255,255,.1);color:var(--white);border:none;border-radius:var(--radius);padding:16px;font-size:20px;font-weight:500;cursor:pointer;font-family:'Sarabun',sans-serif;transition:.15s}
  .pin-btn:active{background:rgba(255,255,255,.25);transform:scale(.95)}
  .pin-btn.del{font-size:16px;color:rgba(255,255,255,.6)}
  .login-err{color:var(--red);font-size:13px;margin-top:.5rem;min-height:20px}

  /* ── TOP NAV ── */
  .topnav{background:var(--navy);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
  .topnav-logo{width:32px;height:32px;background:var(--yellow);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--navy);flex-shrink:0}
  .topnav-title{color:var(--white);font-size:15px;font-weight:600;flex:1}
  .topnav-branch{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
  .topnav-logout{background:none;border:none;color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;font-family:'Sarabun',sans-serif;padding:4px 8px}

  /* ── BOTTOM NAV ── */
  .botnav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--gray-200);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  .botnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;cursor:pointer;border:none;background:none;color:var(--gray-600);font-family:'Sarabun',sans-serif;transition:.15s;gap:3px}
  .botnav-btn.active{color:var(--navy)}
  .botnav-btn svg{width:22px;height:22px}
  .botnav-label{font-size:10px;font-weight:500}
  .page-content{padding:16px;padding-bottom:80px}

  /* ── CARDS ── */
  .card{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  .card-title{font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}

  /* ── CHECKLIST PAGE ── */
  .bike-toggle{display:flex;gap:8px;margin-bottom:16px}
  .bike-btn{flex:1;padding:10px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:'Sarabun',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:var(--white);color:var(--gray-600);transition:.2s}
  .bike-btn.active{border-color:var(--yellow);background:var(--yellow-light);color:var(--navy)}
  .plate-input{width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:'Sarabun',sans-serif;font-size:15px;margin-bottom:16px;outline:none;background:var(--white)}
  .plate-input:focus{border-color:var(--yellow)}
  .chk-section{margin-bottom:12px}
  .chk-section-head{font-size:11px;font-weight:600;color:var(--gray-600);letter-spacing:.5px;text-transform:uppercase;padding:6px 0 4px;border-bottom:1px solid var(--gray-200);margin-bottom:6px;display:flex;justify-content:space-between}
  .chk-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:.15s}
  .chk-item:active{background:var(--gray-100)}
  .chk-item.done{background:var(--green-light)}
  .chk-cb{width:20px;height:20px;border:2px solid var(--gray-400);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s}
  .chk-item.done .chk-cb{background:var(--green);border-color:var(--green)}
  .chk-check{color:white;font-size:13px;font-weight:700}
  .chk-name{flex:1;font-size:14px}
  .chk-item.done .chk-name{color:var(--gray-600);text-decoration:line-through}
  .chk-time{font-size:10px;background:var(--gray-100);color:var(--gray-600);padding:2px 7px;border-radius:3px;flex-shrink:0}
  .chk-upsell{font-size:10px;background:#FFF3E0;color:#E65100;padding:2px 7px;border-radius:3px;flex-shrink:0}
  .chk-alert{font-size:10px;background:#FFEBEE;color:#B71C1C;padding:2px 7px;border-radius:3px;flex-shrink:0}
  .time-bar-wrap{background:var(--gray-100);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .time-bar-track{flex:1;height:6px;background:var(--gray-200);border-radius:3px}
  .time-bar-fill{height:6px;border-radius:3px;background:var(--green);transition:width .3s}
  .time-bar-label{font-size:12px;color:var(--gray-600);min-width:90px;text-align:right}
  .chk-save-btn{width:100%;padding:14px;background:var(--navy);color:white;border:none;border-radius:var(--radius);font-family:'Sarabun',sans-serif;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
  .chk-save-btn:active{transform:scale(.98)}

  /* ── POS PAGE ── */
  .pos-search{width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:'Sarabun',sans-serif;font-size:15px;margin-bottom:12px;outline:none}
  .pos-search:focus{border-color:var(--yellow)}
  .service-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .service-card{background:var(--white);border:1.5px solid var(--gray-200);border-radius:var(--radius);padding:12px;cursor:pointer;transition:.15s}
  .service-card:active{transform:scale(.97);border-color:var(--yellow)}
  .service-card.in-cart{border-color:var(--yellow);background:var(--yellow-light)}
  .svc-cat{font-size:10px;color:var(--gray-600);margin-bottom:4px;font-weight:500}
  .svc-name{font-size:13px;font-weight:600;color:var(--gray-900);margin-bottom:6px;line-height:1.3}
  .svc-price{font-size:15px;font-weight:700;color:var(--navy)}
  .svc-comm{font-size:10px;color:var(--green);margin-top:2px}
  .cart-section{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .cart-title{font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:10px}
  .cart-empty{font-size:13px;color:var(--gray-400);text-align:center;padding:12px 0}
  .cart-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--gray-100)}
  .cart-item:last-child{border-bottom:none}
  .cart-item-name{flex:1;font-size:13px}
  .cart-item-price{font-size:13px;font-weight:600;color:var(--navy);min-width:60px;text-align:right}
  .cart-item-del{background:none;border:none;color:var(--gray-400);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
  .cart-total{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:4px;border-top:1.5px solid var(--gray-200)}
  .cart-total-label{font-size:14px;font-weight:600}
  .cart-total-val{font-size:20px;font-weight:700;color:var(--navy)}
  .cart-comm-row{display:flex;justify-content:space-between;font-size:12px;color:var(--green);margin-top:4px}
  .pos-plate-input{width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:'Sarabun',sans-serif;font-size:15px;margin-bottom:8px;outline:none}
  .checkout-btn{width:100%;padding:14px;background:var(--yellow);color:var(--navy);border:none;border-radius:var(--radius);font-family:'Sarabun',sans-serif;font-size:16px;font-weight:700;cursor:pointer}
  .checkout-btn:active{transform:scale(.98)}
  .checkout-btn:disabled{background:var(--gray-200);color:var(--gray-400);cursor:default}

  /* ── SUMMARY PAGE ── */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .stat-card{background:var(--white);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center}
  .stat-val{font-size:24px;font-weight:700;color:var(--navy)}
  .stat-label{font-size:12px;color:var(--gray-600);margin-top:4px}
  .stat-card.highlight .stat-val{color:var(--green)}
  .job-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--gray-100)}
  .job-row:last-child{border-bottom:none}
  .job-plate{font-size:13px;font-weight:600;background:var(--navy);color:var(--white);padding:2px 8px;border-radius:4px;flex-shrink:0;min-width:70px;text-align:center}
  .job-details{flex:1;padding:0 10px}
  .job-services{font-size:12px;color:var(--gray-600);margin-top:2px}
  .job-total{font-size:14px;font-weight:700;color:var(--navy)}
  .job-comm{font-size:11px;color:var(--green)}
  .job-time{font-size:11px;color:var(--gray-400)}

  /* ── TOAST ── */
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--gray-900);color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:.3s;white-space:nowrap}
  .toast.show{opacity:1}

  /* ── MODAL ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-box{background:var(--white);border-radius:14px;padding:24px;width:100%;max-width:340px}
  .modal-title{font-size:17px;font-weight:700;margin-bottom:8px}
  .modal-body{font-size:14px;color:var(--gray-600);line-height:1.6;margin-bottom:20px}
  .modal-btns{display:flex;gap:10px}
  .modal-btn{flex:1;padding:12px;border:none;border-radius:var(--radius);font-family:'Sarabun',sans-serif;font-size:15px;font-weight:600;cursor:pointer}
  .modal-btn.primary{background:var(--yellow);color:var(--navy)}
  .modal-btn.secondary{background:var(--gray-100);color:var(--gray-800)}

  @media print{.botnav,.topnav,.checkout-btn,.chk-save-btn{display:none}}
</style>
</head>
<body>

<!-- MAIN APP -->
<div id="screen-main" class="screen">
  <!-- Top Nav -->
  <div class="topnav">
    <div class="topnav-logo">B</div>

  </div>

  <!-- Pages -->
  <div id="page-checklist" class="page-content"></div>

  <!-- Bottom Nav -->
  <nav class="botnav">
    <button class="botnav-btn active" id="nav-checklist" onclick="showPage('checklist')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span class="botnav-label">ตรวจรถ</span>
    </button>
    <button class="botnav-btn" id="nav-pos" onclick="showPage('pos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span class="botnav-label">POS ขาย</span>
    </button>
    <button class="botnav-btn" id="nav-summary" onclick="showPage('summary')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-6 6"/></svg>
      <span class="botnav-label">สรุปวัน</span>
    </button>
  </nav>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

window.fsCollection = collection;

// ─────────────────────────────────────────────
// LOGIN
// ─────────────────────────────────────────────
function pinPress(d) {
  if (state.pin.length >= 4) return;
  state.pin += d;
  updateDots();
  if (state.pin.length === 4) tryLogin();
}
function pinDel() {
  state.pin = state.pin.slice(0, -1);
  updateDots();
  document.getElementById('login-err').textContent = '';
}
function updateDots() {
  for (let i = 0; i < 4; i++)
    document.getElementById('d' + i).classList.toggle('filled', i < state.pin.length);
}
function tryLogin() {
  const branch = document.getElementById('login-branch').value;
  if (!branch) { document.getElementById('login-err').textContent = 'กรุณาเลือกสาขาก่อน'; state.pin = ''; updateDots(); return; }
  let role = null;
  for (const [r, p] of Object.entries(PINS)) { if (p === state.pin) { role = r; break; } }
  if (!role) {
    document.getElementById('login-err').textContent = 'PIN ไม่ถูกต้อง';
    state.pin = ''; updateDots(); return;
  }
  state.branch = branch; state.role = role;
  document.getElementById('nav-branch').textContent = branch + ' · ' + role;
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  renderChecklist(); renderPOS(); loadTodayJobs();
}
function logout() {
  state.pin = ''; state.branch = ''; state.role = '';
  state.cart = []; state.checkedItems = new Set();
  document.getElementById('screen-main').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
  updateDots();
}

// ─────────────────────────────────────────────
// PAGE NAVIGATION
// ─────────────────────────────────────────────
function showPage(p) {
  ['checklist','pos','summary'].forEach(name => {
    document.getElementById('page-' + name).classList.toggle('hidden', name !== p);
    document.getElementById('nav-' + name).classList.toggle('active', name === p);
  });
  if (p === 'summary') loadTodayJobs();
}

// ─────────────────────────────────────────────
// CHECKLIST
// ─────────────────────────────────────────────
function renderChecklist() {
  const el = document.getElementById('page-checklist');
  const sections = [...CHECKLIST.shared, ...(state.bikeType === 'scooter' ? CHECKLIST.scooter : CHECKLIST.manual)];
  const totalTime = sections.flatMap(s => s.items).reduce((a, i) => a + i.t, 0);
  const checkedTime = sections.flatMap(s => s.items).filter(i => state.checkedItems.has(i.id)).reduce((a, i) => a + i.t, 0);
  const pct = Math.min(100, Math.round(checkedTime / totalTime * 100));
  const checkedCount = state.checkedItems.size;
  const totalCount = sections.flatMap(s => s.items).length;

  el.innerHTML = `
    <div class="bike-toggle">
      <button class="bike-btn${state.bikeType==='scooter'?' active':''}" onclick="setBikeType('scooter')">สกู๊ตเตอร์ (Click/Scoopy)</button>
      <button class="bike-btn${state.bikeType==='manual'?' active':''}" onclick="setBikeType('manual')">มาเนียล (Wave/Dream)</button>
    </div>
    <input class="plate-input" placeholder="ทะเบียนรถ เช่น กข 1234" value="${state.plate}" oninput="state.plate=this.value" id="chk-plate">
    <div class="time-bar-wrap">
      <span style="font-size:12px;color:var(--gray-600);white-space:nowrap">ตรวจแล้ว ${checkedCount}/${totalCount}</span>
      <div class="time-bar-track"><div class="time-bar-fill" style="width:${pct}%"></div></div>
      <span class="time-bar-label">${checkedTime.toFixed(1)} / ~${totalTime} นาที</span>
    </div>
    ${sections.map(sec => `
      <div class="card">
        <div class="chk-section-head">${sec.sec}<span style="font-weight:400;letter-spacing:0">${sec.time}</span></div>
        ${sec.items.map(item => `
          <div class="chk-item${state.checkedItems.has(item.id)?' done':''}" onclick="toggleCheck('${item.id}')">
            <div class="chk-cb"><span class="chk-check">${state.checkedItems.has(item.id)?'✓':''}</span></div>
            <div class="chk-name">${item.name}</div>
            <span class="chk-time">${item.time}</span>
            ${item.tag==='upsell'?`<span class="chk-upsell">${item.tagText}</span>`:''}
            ${item.tag==='alert'?`<span class="chk-alert">${item.tagText}</span>`:''}
          </div>
        `).join('')}
      </div>
    `).join('')}
    <textarea id="chk-note" placeholder="หมายเหตุ / ปัญหาที่พบ..." style="width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:'Sarabun',sans-serif;font-size:14px;resize:none;outline:none;margin-bottom:8px" rows="2"></textarea>
    <button class="chk-save-btn" onclick="saveChecklist()">บันทึกการตรวจรถ</button>
  `;
}

function setBikeType(t) { state.bikeType = t; state.checkedItems = new Set(); renderChecklist(); }
function toggleCheck(id) {
  if (state.checkedItems.has(id)) state.checkedItems.delete(id);
  else state.checkedItems.add(id);
  renderChecklist();
}

async function saveChecklist() {
  const plate = document.getElementById('chk-plate')?.value || state.plate;
  if (!plate) { showToast('กรุณาใส่ทะเบียนรถ'); return; }
  const note = document.getElementById('chk-note')?.value || '';
  const sections = [...CHECKLIST.shared, ...(state.bikeType === 'scooter' ? CHECKLIST.scooter : CHECKLIST.manual)];
  const checkedNames = sections.flatMap(s => s.items).filter(i => state.checkedItems.has(i.id)).map(i => i.name);
  const data = {
    type: 'checklist', branch: state.branch, role: state.role,
    plate, bikeType: state.bikeType, checkedItems: checkedNames,
    note, createdAt: window.fsTimestamp?.() || new Date()
  };
  try {
    if (window.db) await window.fsAddDoc(window.fsCollection(window.db, 'bikeJobs'), data);
    showToast('บันทึกการตรวจรถเรียบร้อย ✓');
    state.checkedItems = new Set(); state.plate = '';
    renderChecklist();
  } catch(e) { showToast('บันทึกไม่สำเร็จ: ' + e.message); }
}

// ─────────────────────────────────────────────
// POS
// ─────────────────────────────────────────────
let searchQ = '';
function renderPOS() {
  const el = document.getElementById('page-pos');
  const cats = [...new Set(SERVICES.map(s => s.cat))];
  const filtered = SERVICES.filter(s => !searchQ || s.name.includes(searchQ) || s.cat.includes(searchQ));
  const cartTotal = state.cart.reduce((a, i) => a + i.price, 0);
  const cartComm  = state.cart.reduce((a, i) => a + i.comm, 0);
  const inCart = new Set(state.cart.map(i => i.id));

  el.innerHTML = `
    <input class="pos-search" placeholder="ค้นหาบริการ..." value="${searchQ}" oninput="searchQ=this.value;renderPOS()" id="pos-search-input">
    <div class="service-grid">
      ${filtered.map(s => `
        <div class="service-card${inCart.has(s.id)?' in-cart':''}" onclick="addToCart('${s.id}')">
          <div class="svc-cat">${s.cat}</div>
          <div class="svc-name">${s.name}</div>
          <div class="svc-price">฿${s.price.toLocaleString()}</div>
          <div class="svc-comm">ค่าคอมช่าง ฿${s.comm}</div>
        </div>
      `).join('')}
    </div>
    <div class="cart-section">
      <div class="cart-title">ตะกร้า (${state.cart.length} รายการ)</div>
      ${state.cart.length === 0 ? '<div class="cart-empty">ยังไม่มีรายการ</div>' : ''}
      ${state.cart.map((item, idx) => `
        <div class="cart-item">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-price">฿${item.price.toLocaleString()}</div>
          <button class="cart-item-del" onclick="removeFromCart(${idx})">×</button>
        </div>
      `).join('')}
      ${state.cart.length > 0 ? `
        <div class="cart-total">
          <span class="cart-total-label">รวม</span>
          <span class="cart-total-val">฿${cartTotal.toLocaleString()}</span>
        </div>
        <div class="cart-comm-row"><span>ค่าคอมช่างรวม</span><span>฿${cartComm}</span></div>
      ` : ''}
    </div>
    ${state.cart.length > 0 ? `
      <input class="pos-plate-input" placeholder="ทะเบียนรถ..." value="${state.posBikePlate}" oninput="state.posBikePlate=this.value" id="pos-plate">
      <button class="checkout-btn" onclick="checkout()">ชำระเงิน ฿${cartTotal.toLocaleString()}</button>
    ` : ''}
  `;
}

function addToCart(id) {
  const svc = SERVICES.find(s => s.id === id);
  if (!svc) return;
  state.cart.push({...svc});
  renderPOS();
  showToast('เพิ่ม: ' + svc.name);
}
function removeFromCart(idx) {
  state.cart.splice(idx, 1);
  renderPOS();
}

async function checkout() {
  const plate = document.getElementById('pos-plate')?.value || state.posBikePlate;
  if (!plate) { showToast('กรุณาใส่ทะเบียนรถ'); return; }
  if (state.cart.length === 0) return;
  const total = state.cart.reduce((a, i) => a + i.price, 0);
  const comm  = state.cart.reduce((a, i) => a + i.comm, 0);
  const data = {
    type: 'sale', branch: state.branch, role: state.role,
    plate, services: state.cart.map(i => i.name),
    total, commission: comm,
    createdAt: window.fsTimestamp?.() || new Date()
  };
  try {
    if (window.db) await window.fsAddDoc(window.fsCollection(window.db, 'bikeJobs'), data);
    showToast(`ชำระ ฿${total.toLocaleString()} เรียบร้อย ✓`);
    state.cart = []; state.posBikePlate = '';
    renderPOS();
  } catch(e) { showToast('บันทึกไม่สำเร็จ'); console.error(e); }
}

// ─────────────────────────────────────────────
// SUMMARY
// ─────────────────────────────────────────────
async function loadTodayJobs() {
  const el = document.getElementById('page-summary');
  el.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--gray-400)">กำลังโหลด...</div>';

  let jobs = [];
  try {
    if (window.db) {
      const today = new Date(); today.setHours(0,0,0,0);
      const snap = await window.fsGetDocs(
        window.fsQuery(window.fsCollection(window.db,'bikeJobs'),
          window.fsWhere('branch','==',state.branch),
          window.fsWhere('createdAt','>=',window.FsTimestamp.fromDate(today)),
          window.fsOrderBy('createdAt','desc'))
      );
      snap.forEach(d => jobs.push({id:d.id,...d.data()}));
    }
  } catch(e) { console.error(e); }

  const sales = jobs.filter(j => j.type === 'sale');
  const checks = jobs.filter(j => j.type === 'checklist');
  const totalRev  = sales.reduce((a, j) => a + (j.total||0), 0);
  const totalComm = sales.reduce((a, j) => a + (j.commission||0), 0);

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-val">${sales.length}</div><div class="stat-label">งานขายวันนี้</div></div>
      <div class="stat-card highlight"><div class="stat-val">฿${totalRev.toLocaleString()}</div><div class="stat-label">รายได้รวม</div></div>
      <div class="stat-card"><div class="stat-val">${checks.length}</div><div class="stat-label">รถที่ตรวจแล้ว</div></div>
      <div class="stat-card"><div class="stat-val">฿${totalComm.toLocaleString()}</div><div class="stat-label">ค่าคอมช่างรวม</div></div>
    </div>
    <div class="card">
      <div class="card-title">รายการขายวันนี้</div>
      ${sales.length === 0 ? '<div style="text-align:center;color:var(--gray-400);padding:12px">ยังไม่มีรายการ</div>' : ''}
      ${sales.map(j => `
        <div class="job-row">
          <div class="job-plate">${j.plate||'—'}</div>
          <div class="job-details">
            <div style="font-size:13px;font-weight:500">${(j.services||[]).join(', ')}</div>
            <div class="job-services">ค่าคอม ฿${j.commission||0}</div>
          </div>
          <div>
            <div class="job-total">฿${(j.total||0).toLocaleString()}</div>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <div class="card-title">รถที่ตรวจวันนี้ (${checks.length} คัน)</div>
      ${checks.length === 0 ? '<div style="text-align:center;color:var(--gray-400);padding:12px">ยังไม่มีข้อมูล</div>' : ''}
      ${checks.map(j => `
        <div class="job-row">
          <div class="job-plate">${j.plate||'—'}</div>
          <div class="job-details">
            <div style="font-size:12px;color:var(--gray-600)">${(j.checkedItems||[]).length} รายการตรวจ · ${j.bikeType==='scooter'?'สกู๊ตเตอร์':'มาเนียล'}</div>
            ${j.note?`<div style="font-size:11px;color:var(--gray-400);margin-top:2px">${j.note}</div>`:''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// ─────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// expose globals
window.pinPress = pinPress; window.pinDel = pinDel;
window.logout = logout; window.showPage = showPage;
window.setBikeType = setBikeType; window.toggleCheck = toggleCheck;
window.saveChecklist = saveChecklist; window.addToCart = addToCart;
window.removeFromCart = removeFromCart; window.checkout = checkout;
</script>
