<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>Normalize วันที่ → ค.ศ.</title>
<style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:20px;background:#1a1a1a;color:#eee;}
button{background:#C9A84C;color:#000;border:none;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin:4px;}
button.scan{background:#4a9eff;color:#fff;} button.go{background:#5cb85c;color:#fff;}
button:disabled{opacity:.4;cursor:not-allowed;}
#log{margin-top:20px;font-size:13px;line-height:1.7;max-height:480px;overflow-y:auto;background:#000;padding:16px;border-radius:10px;}
.ok{color:#6cd86c;} .err{color:#ff6b6b;} .info{color:#888;} .warn-txt{color:#ffc107;}
h1{font-size:20px;}
.warn{background:#1e3a1e;border:1px solid #6cd86c;padding:14px;border-radius:10px;margin:16px 0;font-size:13px;}</style>
</head><body>
<h1>📅 Normalize วันที่ทั้งหมด → ค.ศ. (DD/MM/YYYY)</h1>
<div class="warn">แปลงวันที่ในบิลที่เป็น พ.ศ. (เช่น 23/6/2569) → ค.ศ. (23/06/2026)<br>
รูปแบบมาตรฐาน: <b>DD/MM/YYYY ค.ศ.</b> เลขวัน/เดือน 2 หลัก<br>
แก้ field date ใน transactions · ✅ สแกนก่อน</div>
<button class="scan" id="scanBtn" onclick="scan()">🔍 สแกนก่อน</button>
<button class="go" id="goBtn" onclick="doFix()" disabled>📅 แปลงเป็น ค.ศ. ทั้งหมด</button>
<div id="log"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import{getFirestore,collection,getDocs,updateDoc,doc}from'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
const FB={apiKey:'AIzaSyDSuBAXVbzaMwNJEVQYxYDF8Q0zPWYxUhQ',authDomain:'carcare-pos-559ef.firebaseapp.com',projectId:'carcare-pos-559ef',storageBucket:'carcare-pos-559ef.appspot.com',appId:'1:562909364593:web:549e45b521adb45247f6d0'};
const app=initializeApp(FB);const db=getFirestore(app);
const L=(m,c='info')=>{const d=document.getElementById('log');d.innerHTML+=`<div class="${c}">${m}</div>`;d.scrollTop=d.scrollHeight;};

// Convert any date string to DD/MM/YYYY (CE)
function normalize(dateStr){
  if(!dateStr)return null;
  const p=(''+dateStr).split('/');
  if(p.length!==3)return null;
  let dd=parseInt(p[0]), mm=parseInt(p[1]), yy=parseInt(p[2]);
  if(isNaN(dd)||isNaN(mm)||isNaN(yy))return null;
  if(yy>2400)yy-=543; // BE → CE
  const out=String(dd).padStart(2,'0')+'/'+String(mm).padStart(2,'0')+'/'+yy;
  return out;
}

let plan=[];
window.scan=async function(){
  document.getElementById('log').innerHTML='';
  plan=[];
  L('🔍 กำลังสแกน...');
  const snap=await getDocs(collection(db,'transactions'));
  let changeBE=0,changeFmt=0,ok=0;
  const samples=[];
  snap.docs.forEach(d=>{
    const t=d.data();
    const norm=normalize(t.date);
    if(!norm){return;}
    if(norm!==t.date){
      plan.push({id:d.id,old:t.date,new:norm});
      if(/25\d\d$/.test(t.date))changeBE++;else changeFmt++;
      if(samples.length<15)samples.push(t.date+' → '+norm);
    } else ok++;
  });
  L(`<b>Transactions: ${snap.size} บิล</b>`);
  L(`✅ ถูกต้องแล้ว: ${ok}`,'ok');
  L(`🔄 พ.ศ.→ค.ศ.: ${changeBE} · ปรับ format: ${changeFmt}`,'warn-txt');
  L('<br>ตัวอย่างที่จะแก้:');
  samples.forEach(s=>L('  '+s,'info'));
  if(plan.length>0)document.getElementById('goBtn').disabled=false;
  else L('<br>✅ ทุกบิลเป็น ค.ศ. ถูกต้องแล้ว','ok');
};

window.doFix=async function(){
  if(!confirm(`แปลง ${plan.length} บิลเป็น ค.ศ.?`))return;
  const btn=document.getElementById('goBtn');btn.disabled=true;btn.textContent='กำลังแก้...';
  document.getElementById('scanBtn').disabled=true;
  let n=0;
  for(const p of plan){try{await updateDoc(doc(db,'transactions',p.id),{date:p.new});n++;if(n%20===0)L('  '+n+'...');}catch(e){L('❌'+e.message,'err');}}
  L(`<br>🎉 แปลงเสร็จ ${n} บิล · รีเฟรช Dashboard — เดือนนี้จะแสดงครบแล้ว`,'ok');
  btn.textContent='✅ เสร็จแล้ว';
};
</script></body></html>
